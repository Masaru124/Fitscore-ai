# FitScore AI Infrastructure
# ponytail: minimal Postgres + Redis setup for local development

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitscore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitscore
      POSTGRES_PASSWORD: fitscore_dev_password
      POSTGRES_DB: fitscore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fitscore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
